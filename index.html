<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SICHER DENKEN.</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3ef;color:#18392f;font:16px/1.5 system-ui,Arial}.wrap{max-width:900px;margin:auto;padding:24px}.hero{background:#102d27;color:white;min-height:100vh}.hero h1{font-size:clamp(58px,10vw,105px);line-height:.95;letter-spacing:-.075em;margin:65px 0 30px}.hero h1 em{color:#c7f18c;font-style:normal}.hero p{max-width:650px;font-size:21px;color:#d2e6da}.label{color:#23824c;font-size:12px;letter-spacing:.13em;font-weight:900}.hero .label{color:#c7f18c}.btn{border:0;background:#c7f18c;border-radius:12px;padding:15px 24px;font-weight:800;font-size:16px;cursor:pointer}.btn:disabled{opacity:.4;cursor:default}.btn.alt{background:#e5eee7}.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:55px}.topic{border:1px solid #527062;border-radius:15px;padding:18px}.topic small{display:block;color:#bdd1c4}header{background:#102d27;color:white}header .wrap{display:flex;justify-content:space-between}.card{background:white;border-radius:20px;padding:clamp(22px,4vw,40px);margin:25px 0;box-shadow:0 12px 45px #163c2c12}h2{font-size:clamp(29px,5vw,49px);letter-spacing:-.045em;line-height:1.08}.scene{background:#173c31;color:white;border-radius:15px;padding:24px;font-size:19px;margin:24px 0}.option{display:block;width:100%;background:#f2f7f3;border:2px solid #e0e9e2;text-align:left;padding:17px;margin:10px 0;border-radius:12px;color:#18392f;font:inherit;cursor:pointer}.option.selected{border-color:#218851;background:#e4f5e8}.option:disabled{cursor:default}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.feedback{background:#e6f4e8;border-left:5px solid #238b53;padding:22px;border-radius:12px;margin-top:20px}.feedback.warn{background:#fff3e5;border-color:#c98a37}.progress{height:7px;background:#d6e4d9;border-radius:20px;margin-top:25px;overflow:hidden}.progress div{height:100%;background:#27965c}.score{font-size:80px;font-weight:900;color:#16814c}.review{border-top:1px solid #e0e9e3;padding:14px 0}.review summary{cursor:pointer;font-weight:800}.foot{font-size:12px;color:#6c8073;padding-bottom:25px}@media(max-width:650px){.topics{grid-template-columns:1fr}.wrap{padding:17px}}</style><div id="app"></div><script>
const cases=[
['Brandschutz','Der Flur ist doch breit genug.','Kartons stehen vor dem gekennzeichneten Notausgang. „Die kommen nachher weg“, sagt ein Kollege.','Was ist sinnvoll?',['Abwarten, solange das Schild sichtbar ist.','Die Einschränkung ansprechen und den Fluchtweg unverzüglich freimachen lassen.','Erst bei der nächsten Unterweisung ansprechen.'],1,'Fluchtwege müssen jederzeit entsprechend ihrer vorgesehenen Nutzung sicher benutzbar sein. Auch eine kurze Lagerung kann die Schutzfunktion beeinträchtigen.','ArbStättV Anhang 2.3; ASR A2.3.'],
['Brandschutz','Die versteckte Schwachstelle.','Im Lager ist eine Brandschutztür mit einem Keil offengehalten. „Sonst kommen die Wagen nicht durch“, erklärt das Team.','Was ist die beste Lösung?',['Den Keil belassen, solange die Tür sichtbar ist.','Die Schutzfunktion wiederherstellen lassen und den Arbeitsablauf mit den Zuständigen klären.','Die Tür dauerhaft ausbauen.'],1,'Eine vorgesehene Brand- oder Rauchschutzfunktion darf nicht durch einen Keil außer Kraft gesetzt werden. Zugleich sollte der Betrieb die Ursache der improvisierten Lösung angehen. Eine geeignete Feststellanlage kann im Einzelfall eine fachlich zu prüfende Lösung sein.','ArbStättV Anhang 2.2; Brandschutzkonzept.'],
['Brandschutz','Ein Besucher fehlt.','Räumungsalarm. Du bist bereits draußen. Eine Kollegin sagt: „Ein Besucher könnte noch im dritten Stock sein.“','Wie reagierst du?',['Selbst zurücklaufen.','Die Information unverzüglich an die zuständige Räumungsorganisation oder Einsatzkräfte weitergeben.','Abwarten, ob er auftaucht.'],1,'Eine möglicherweise fehlende Person muss an die zuständigen Stellen gemeldet werden. Unkontrolliertes Zurücklaufen kann zusätzliche Personen gefährden.','§ 10 ArbSchG; betrieblicher Räumungsplan.'],
['Lithium-Ionen','Der Akku fällt. Das Gerät läuft.','Ein Werkzeugakku fällt herunter. Das Gehäuse hat einen Riss. Ein Kollege will ihn wieder laden.','Was ist richtig?',['Weiterladen, solange er funktioniert.','Nicht mehr nutzen oder laden; fachkundige Klärung veranlassen.','Direkt in die normale Sammelbox legen.'],1,'Ein mechanisch beschädigter Akku kann innere Schäden aufweisen. Seine Funktion beweist nicht, dass er sicher ist. Weitere Handhabung und Entsorgung müssen fachkundig geklärt werden.','ArbSchG §§ 3, 5; Herstellerinformationen.'],
['Lithium-Ionen','Zischen hinter der Tür.','Im Fahrradraum zischt ein E-Bike-Akku und setzt Rauch frei.','Was hat Vorrang?',['Akku schnell nach draußen tragen.','Abstand gewinnen, andere warnen und nach Notfallplan alarmieren.','Akku öffnen und die Ursache suchen.'],1,'Rauch und Zischen können auf einen gefährlichen Fehlerzustand hinweisen. Keine improvisierten Transport- oder Reparaturversuche. Eigensicherung und Alarmierung gehen vor.','§ 10 ArbSchG; ASR A2.2.'],
['Lithium-Ionen','Gefahrgut = Gefahrstoff?','Ein Kollege sagt: „Lithium-Ionen-Batterien sind Gefahrgutklasse 9. Also ist jeder geschlossene Akku automatisch ein Gefahrstoff nach GefStoffV.“','Stimmt das?',['Ja, die Transportklasse bestimmt die Gefahrstoffeinstufung.','Nein, Transport- und Gefahrstoffrecht haben unterschiedliche Anknüpfungspunkte.','Ja, aber nur bei Akkus mit Prüfplakette.'],1,'Bei der Beförderung gelten grundsätzlich Gefahrgutvorschriften, häufig Klasse 9 mit UN 3480 oder UN 3481. Das bedeutet nicht automatisch, dass der geschlossene Akku als solcher Gefahrstoff im Sinne der GefStoffV ist.','ADR; GefStoffV.'],
['Elektrische Sicherheit','Gestern geprüft. Heute beschädigt.','Eine Kaffeemaschine trägt eine aktuelle Prüfplakette. Heute ist die Anschlussleitung sichtbar beschädigt.','Was tust du?',['Bis zur nächsten Prüfung weiterbenutzen.','Nicht weiterverwenden und die zuständige Stelle informieren.','Nur die Plakette entfernen.'],1,'Eine Prüfung bewertet den Zustand zum Prüfzeitpunkt. Ein neuer Schaden verlangt eine unmittelbare Reaktion und fachkundige Klärung.','BetrSichV; DGUV Vorschrift 3.'],
['Elektrische Sicherheit','Alle zwei Jahre. Immer?','Eine Kollegin sagt: „Jedes ortsveränderliche elektrische Arbeitsmittel muss ausnahmslos alle zwei Jahre geprüft werden.“','Wie beurteilst du das?',['Die Zweijahresfrist gilt immer.','Prüfpflicht und Frist hängen von einschlägigen Vorgaben und Einsatzbedingungen ab.','Wiederkehrende Prüfungen sind grundsätzlich unnötig.'],1,'Es gibt keine universelle Zweijahresfrist für jedes Gerät. Beanspruchung, Einsatzbedingungen, Gefährdungsbeurteilung und Prüferfahrungen sind zu berücksichtigen.','DGUV Vorschrift 3 § 5; BetrSichV §§ 3, 14; TRBS 1201.'],
['Elektrische Sicherheit','Die Leiste unter dem Schreibtisch.','Eine Steckdosenleiste ist mit maximal 3.500 W gekennzeichnet. Gleichzeitig laufen Wasserkocher (2.200 W) und Heizlüfter (1.500 W).','Was stimmt?',['Unproblematisch, weil jedes Gerät unter 3.500 W liegt.','Die Gesamtleistung von 3.700 W überschreitet die Kennzeichnung.','Mit CE-Kennzeichnung ist die Kombination sicher.'],1,'2.200 W + 1.500 W = 3.700 W. Das überschreitet die angegebene Gesamtleistung von 3.500 W. Die gleichzeitige Belastung ist entscheidend.','Herstellerkennzeichnung; ArbSchG § 5; BetrSichV.']];
let i=-1,sel=-1,checked=false,answers=[];const app=document.getElementById('app');function home(){app.innerHTML=`<section class="hero"><div class="wrap"><div class="label">INTERAKTIVER SICHERHEITSPARCOURS</div><h1>SICHER<br><em>DENKEN.</em></h1><p>Neun Situationen. Drei Themenwelten. Eine Frage: <b>Was würdest du tun?</b></p><p>Entscheide selbst. Entdecke Denkfehler. Verstehe die Lösungen. Ohne Anmeldung, ohne Zeitdruck.</p><button class="btn" onclick="start()">Parcours starten →</button><div class="topics"><div class="topic"><b>01 · Brandschutz</b><small>Sehen und handeln</small></div><div class="topic"><b>02 · Lithium-Ionen</b><small>Warnzeichen erkennen</small></div><div class="topic"><b>03 · Elektrik</b><small>Prüfmythen auflösen</small></div></div></div></section>`}function start(){i=0;answers=[];sel=-1;checked=false;show()}function choose(n){sel=n;show()}function verify(){checked=true;answers[i]=sel;show()}function next(){i++;sel=-1;checked=false;show()}function show(){if(i===cases.length){end();return}let q=cases[i];app.innerHTML=`<header><div class="wrap"><b>SICHER DENKEN.</b><span>FALL ${i+1} / 9</span></div></header><main class="wrap"><div class="progress"><div style="width:${i/9*100}%"></div></div><article class="card"><div class="label">${q[0].toUpperCase()} · ENTSCHEIDUNG ${i+1}</div><h2>${q[1]}</h2><div class="scene">${q[2]}</div><h3>${q[3]}</h3>${q[4].map((x,n)=>`<button class="option ${sel===n?'selected':''}" ${checked?'disabled':''} onclick="choose(${n})"><b>${'ABC'[n]}.</b> ${x}</button>`).join('')}${checked?`<div class="feedback ${sel===q[5]?'':'warn'}"><h3>${sel===q[5]?'Gut entschieden!':'Hier steckt der Denkfehler.'}</h3><p>${q[6]}</p><small><b>Rechtsanker:</b> ${q[7]}</small></div>`:''}<div class="row">${checked?`<button class="btn" onclick="next()">${i===8?'Auswertung ansehen':'Nächster Fall →'}</button>`:`<button class="btn" ${sel<0?'disabled':''} onclick="verify()">Entscheidung prüfen</button><button class="btn alt" onclick="alert('Denkhilfe: Welche konkrete Schutzfunktion ist betroffen? Was wäre die sicherste nächste Handlung?')">Hinweis</button>`}</div></article><p class="foot">Lernprototyp. Die Auflösungen ersetzen keine betriebliche Gefährdungsbeurteilung, keine fachkundige Prüfung und keinen Notfallplan.</p></main>`}function end(){let score=answers.filter((a,j)=>a===cases[j][5]).length;app.innerHTML=`<header><div class="wrap"><b>SICHER DENKEN.</b><span>GESCHAFFT</span></div></header><main class="wrap"><article class="card"><div class="label">DEINE AUSWERTUNG</div><h2>Du hast nicht nur Antworten gefunden. Du hast Entscheidungen trainiert.</h2><div class="score">${score} / 9</div><p>${score===9?'Alle Fälle richtig eingeordnet. Stark!':'Die wichtigsten Erkenntnisse stecken auch in den Fällen, die du noch einmal anschauen möchtest.'}</p><h3>Alle Lösungen zum Nachlesen</h3>${cases.map((q,j)=>`<details class="review"><summary>${j+1}. ${q[1]} ${answers[j]===q[5]?'✓':'↻'}</summary><p><b>Richtige Entscheidung:</b> ${q[4][q[5]]}</p><p>${q[6]}</p><small>${q[7]}</small></details>`).join('')}<div class="row"><button class="btn" onclick="start()">Noch einmal spielen</button><button class="btn alt" onclick="window.print()">Auswertung drucken</button></div></article><p class="foot">Deine Antworten werden nur während dieser Sitzung im Browser gehalten, nicht an einen Server gesendet. Fachstand Oktober 2026; aktuelle Regelungen und betriebliche Besonderheiten sind gesondert zu prüfen.</p></main>`}home();</script></html>
